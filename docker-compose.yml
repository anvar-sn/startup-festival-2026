services:
  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: always

  web:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    restart: always

  bot:
    build: .
    command: python manage.py runbot
    env_file: .env
    depends_on: [db, web]
    volumes: [media:/app/media]
    restart: always

volumes:
  pgdata:
  media:
